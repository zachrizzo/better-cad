[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
# Truck CAD kernel crates
truck-topology = "0.6"
truck-geometry = "0.5"
truck-modeling = "0.6"
truck-shapeops = "0.4"
truck-stepio = "0.3"
truck-meshalgo = "0.4"
truck-polymesh = "0.6"

# Core utilities
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
nalgebra = "0.33"
uuid = { version = "1", features = ["v4", "serde", "js"] }
thiserror = "2"
log = "0.4"

# WASM bindings
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
tsify-next = { version = "0.5", features = ["js"] }
console_error_panic_hook = "0.1"

# File I/O
dxf = "0.6"
gltf = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
