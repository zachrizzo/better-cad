[package]
name = "bcad-tauri"
version = "0.1.0"
edition = "2021"

[lib]
name = "bcad_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
bcad-kernel = { path = "../bcad-kernel" }
bcad-bim = { path = "../bcad-bim" }
bcad-io = { path = "../bcad-io" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
