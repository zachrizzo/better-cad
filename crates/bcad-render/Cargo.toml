[package]
name = "bcad-render"
version = "0.1.0"
edition = "2021"
description = "Native wgpu-based GPU rendering engine for BetterCAD"

[dependencies]
# GPU / windowing
wgpu = "24"
winit = "0.30"
raw-window-handle = "0.6"
pollster = "0.4"

# Math + serialization
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }

# Image loading (for textures, screenshots)
image = { version = "0.25", default-features = false, features = ["png"] }

# Internal crate
bcad-kernel = { path = "../bcad-kernel" }

# Logging
log.workspace = true
env_logger = "0.11"
